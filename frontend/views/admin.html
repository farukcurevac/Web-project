<div class="container-fluid mt-4">
  <!-- Admin Navigation Tabs -->
  <ul class="nav nav-tabs mb-4" role="tablist">
    <li class="nav-item" role="presentation">
      <button
        class="nav-link active"
        id="stats-tab"
        data-bs-toggle="tab"
        data-bs-target="#stats-content"
        type="button"
        role="tab"
      >
        <i class="fas fa-chart-bar"></i> Dashboard
      </button>
    </li>
    <li class="nav-item" role="presentation">
      <button
        class="nav-link"
        id="users-tab"
        data-bs-toggle="tab"
        data-bs-target="#users-content"
        type="button"
        role="tab"
      >
        <i class="fas fa-users"></i> Users
      </button>
    </li>
    <li class="nav-item" role="presentation">
      <button
        class="nav-link"
        id="orders-tab"
        data-bs-toggle="tab"
        data-bs-target="#orders-content"
        type="button"
        role="tab"
      >
        <i class="fas fa-shopping-cart"></i> Orders
      </button>
    </li>
    <li class="nav-item" role="presentation">
      <button
        class="nav-link"
        id="cars-tab"
        data-bs-toggle="tab"
        data-bs-target="#cars-content"
        type="button"
        role="tab"
      >
        <i class="fas fa-car"></i> All Cars
      </button>
    </li>
    <li class="nav-item" role="presentation">
      <button
        class="nav-link"
        id="reviews-tab"
        data-bs-toggle="tab"
        data-bs-target="#reviews-content"
        type="button"
        role="tab"
      >
        <i class="fas fa-comments"></i> Reviews
      </button>
    </li>
  </ul>

  <!-- Tab Content -->
  <div class="tab-content">
    <!-- Dashboard Stats -->
    <div class="tab-pane fade show active" id="stats-content" role="tabpanel">
      <div class="row mb-4">
        <div class="col-md-3">
          <div class="card bg-primary text-white">
            <div class="card-body">
              <h5 class="card-title">Total Users</h5>
              <h2 id="totalUsersCard">0</h2>
            </div>
          </div>
        </div>
        <div class="col-md-3">
          <div class="card bg-success text-white">
            <div class="card-body">
              <h5 class="card-title">Total Cars</h5>
              <h2 id="totalCarsCard">0</h2>
            </div>
          </div>
        </div>
        <div class="col-md-3">
          <div class="card bg-info text-white">
            <div class="card-body">
              <h5 class="card-title">Total Orders</h5>
              <h2 id="totalOrdersCard">0</h2>
            </div>
          </div>
        </div>
        <div class="col-md-3">
          <div class="card bg-warning text-white">
            <div class="card-body">
              <h5 class="card-title">Active Listings</h5>
              <h2 id="activeListingsCard">0</h2>
            </div>
          </div>
        </div>
      </div>
      <div class="row">
        <div class="col-md-6">
          <div class="card">
            <div class="card-header bg-primary text-white">
              <h5 class="mb-0">Recent Users</h5>
            </div>
            <div class="card-body">
              <table id="recentUsersTable" class="table table-sm"></table>
            </div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="card">
            <div class="card-header bg-primary text-white">
              <h5 class="mb-0">Recent Cars</h5>
            </div>
            <div class="card-body">
              <table id="recentCarsTable" class="table table-sm"></table>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Users Management -->
    <div class="tab-pane fade" id="users-content" role="tabpanel">
      <h4 class="mb-3">User Management</h4>
      <table
        id="adminUsersTable"
        class="table table-striped table-bordered w-100"
      ></table>
    </div>

    <!-- Orders Management -->
    <div class="tab-pane fade" id="orders-content" role="tabpanel">
      <h4 class="mb-3">Order Management</h4>
      <table
        id="adminOrdersTable"
        class="table table-striped table-bordered w-100"
      ></table>
    </div>

    <!-- Cars Management -->
    <div class="tab-pane fade" id="cars-content" role="tabpanel">
      <h4 class="mb-3">All Cars</h4>
      <table
        id="adminCarsTable"
        class="table table-striped table-bordered w-100"
      ></table>
    </div>

    <!-- Reviews Management -->
    <div class="tab-pane fade" id="reviews-content" role="tabpanel">
      <h4 class="mb-3">Reviews</h4>
      <table
        id="adminReviewsTable"
        class="table table-striped table-bordered w-100"
      ></table>
    </div>
  </div>
</div>
