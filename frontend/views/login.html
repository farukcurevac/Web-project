<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login - FarukCars</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/toastr@2.1.4/build/toastr.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/css/index.css" />
  </head>
  <body>
    <main>
      <section class="login-section">
        <div class="container">
          <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
              <div class="login-card">
                <div class="card">
                  <div class="card-body p-4">
                    <h2 class="card-title text-center mb-4">Welcome Back</h2>
                    <p class="text-center text-muted mb-4">
                      Sign in to your FarukCars account
                    </p>

                    <form id="login-form" class="login-form">
                      <!-- Email -->
                      <div class="mb-3">
                        <label for="email" class="form-label"
                          >Email Address</label
                        >
                        <input
                          type="email"
                          class="form-control"
                          id="email"
                          name="email"
                          required
                          placeholder="Enter your email"
                        />
                      </div>

                      <!-- Password -->
                      <div class="mb-3">
                        <label for="password" class="form-label"
                          >Password</label
                        >
                        <input
                          type="password"
                          class="form-control"
                          id="password"
                          name="password"
                          required
                          placeholder="Enter your password"
                        />
                      </div>

                      <!-- Remember Me & Forgot Password -->
                      <div
                        class="d-flex justify-content-between align-items-center mb-4"
                      >
                        <div class="form-check">
                          <input
                            class="form-check-input"
                            type="checkbox"
                            id="rememberMe"
                            name="rememberMe"
                          />
                          <label class="form-check-label" for="rememberMe">
                            Remember me
                          </label>
                        </div>
                        <a href="#" class="text-primary text-decoration-none">
                          Forgot password?
                        </a>
                      </div>

                      <!-- Login Button -->
                      <button
                        type="submit"
                        class="btn btn-primary btn-lg w-100 mb-3"
                      >
                        Sign In
                      </button>

                      <!-- Register Link -->
                      <div class="text-center">
                        <p class="mb-0">
                          Don't have an account?
                          <a
                            href="#register"
                            class="text-primary text-decoration-none"
                          >
                            Sign up here
                          </a>
                        </p>
                      </div>
                    </form>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- Scripts -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-validate/1.17.0/jquery.validate.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/toastr@2.1.4/build/toastr.min.js"></script>

    <!-- Utils -->
    <script src="../utils/constants.js"></script>
    <script src="../utils/rest-client.js"></script>
    <script src="../utils/utils.js"></script>

    <!-- Services -->
    <script src="../services/user-service.js"></script>

    <script type="text/javascript">
      // Initialize login form validation and submission
      $(document).ready(function () {
        UserService.init();
      });
    </script>
  </body>
</html>
