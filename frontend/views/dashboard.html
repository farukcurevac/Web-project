<!-- Dashboard - All sections visible -->
<div class="container mt-4">
  <div class="row">
    <!-- Main Content - Full Width -->
    <div class="col-12">
      <!-- User Profile Header -->
      <div class="text-center mb-4">
        <div
          class="avatar bg-primary rounded-circle d-inline-flex align-items-center justify-content-center"
          style="width: 80px; height: 80px"
        >
          <span class="text-white" style="font-size: 32px">👤</span>
        </div>
        <h3 id="userFullName" class="mt-2">User Name</h3>
      </div>

      <!-- Profile Section -->
      <div id="profile-section" class="content-section mb-4">
        <div class="card mb-3">
          <div class="card-header bg-primary text-white">
            <h5 class="mb-0">My Profile</h5>
          </div>
          <div class="card-body">
            <form id="profileForm">
              <div class="row mb-3">
                <div class="col-md-6">
                  <label class="form-label">First Name</label>
                  <input
                    type="text"
                    class="form-control"
                    id="firstName"
                    name="firstName"
                    required
                  />
                </div>
                <div class="col-md-6">
                  <label class="form-label">Last Name</label>
                  <input
                    type="text"
                    class="form-control"
                    id="lastName"
                    name="lastName"
                    required
                  />
                </div>
              </div>
              <div class="mb-3">
                <label class="form-label">Email</label>
                <input
                  type="email"
                  class="form-control"
                  id="profileEmail"
                  name="email"
                  required
                />
              </div>
              <div class="mb-3">
                <label class="form-label">Phone</label>
                <input
                  type="tel"
                  class="form-control"
                  id="profilePhone"
                  name="phone"
                />
              </div>
              <button type="submit" class="btn btn-primary">
                Update Profile
              </button>
            </form>
          </div>
        </div>
      </div>

      <!-- My Listings Section -->
      <div id="listings-section" class="content-section mb-4">
        <div class="card">
          <div class="card-header bg-primary text-white">
            <div class="d-flex justify-content-between align-items-center">
              <h5 class="mb-0">My Listings</h5>
              <a href="#add" class="btn btn-light btn-sm">Add New Car</a>
            </div>
          </div>
          <div class="card-body">
            <table
              id="myListingsTable"
              class="table table-striped table-bordered w-100"
            ></table>
          </div>
        </div>
      </div>

      <!-- My Orders Section -->
      <div id="orders-section" class="content-section mb-4">
        <div class="card">
          <div class="card-header bg-primary text-white">
            <h5 class="mb-0">My Orders</h5>
          </div>
          <div class="card-body">
            <table
              id="myOrdersTable"
              class="table table-striped table-bordered w-100"
            ></table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
