<div class="container mt-4">
  <div class="row">
    <!-- Sidebar Navigation -->
    <div class="col-md-3">
      <div class="card">
        <div class="card-body">
          <div class="text-center mb-3">
            <div
              class="avatar bg-primary rounded-circle d-inline-flex align-items-center justify-content-center"
              style="width: 80px; height: 80px"
            >
              <span class="text-white" style="font-size: 32px">👤</span>
            </div>
          </div>
          <h5 id="userFullName" class="text-center mb-3">User Name</h5>
          <div class="list-group">
            <a
              href="#"
              onclick="DashboardService.showSection('profile')"
              class="list-group-item list-group-item-action active"
            >
              <i class="fas fa-user"></i> My Profile
            </a>
            <a
              href="#"
              onclick="DashboardService.showSection('listings')"
              class="list-group-item list-group-item-action"
            >
              <i class="fas fa-list"></i> My Listings
            </a>
            <a
              href="#"
              onclick="DashboardService.showSection('orders')"
              class="list-group-item list-group-item-action"
            >
              <i class="fas fa-shopping-cart"></i> My Orders
            </a>
          </div>
        </div>
      </div>
    </div>

    <!-- Main Content -->
    <div class="col-md-9">
      <!-- Profile Section -->
      <div id="profile-section" class="content-section">
        <div class="card mb-3">
          <div class="card-header bg-primary text-white">
            <h5 class="mb-0">Profile Information</h5>
          </div>
          <div class="card-body">
            <form id="profileForm">
              <div class="row mb-3">
                <div class="col-md-6">
                  <label class="form-label">First Name</label>
                  <input
                    type="text"
                    class="form-control"
                    id="firstName"
                    name="firstName"
                    required
                  />
                </div>
                <div class="col-md-6">
                  <label class="form-label">Last Name</label>
                  <input
                    type="text"
                    class="form-control"
                    id="lastName"
                    name="lastName"
                    required
                  />
                </div>
              </div>
              <div class="mb-3">
                <label class="form-label">Email</label>
                <input
                  type="email"
                  class="form-control"
                  id="profileEmail"
                  name="email"
                  required
                />
              </div>
              <div class="mb-3">
                <label class="form-label">Phone</label>
                <input
                  type="tel"
                  class="form-control"
                  id="profilePhone"
                  name="phone"
                />
              </div>
              <div class="mb-3">
                <label class="form-label">City</label>
                <input
                  type="text"
                  class="form-control"
                  id="profileCity"
                  name="city"
                />
              </div>
              <button type="submit" class="btn btn-primary">
                Update Profile
              </button>
            </form>
          </div>
        </div>
      </div>

      <!-- My Listings Section -->
      <div id="listings-section" class="content-section d-none">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h4>My Car Listings</h4>
          <a href="#add" class="btn btn-primary btn-sm">Add New Car</a>
        </div>
        <table
          id="myListingsTable"
          class="table table-striped table-bordered w-100"
        ></table>
      </div>

      <!-- My Orders Section -->
      <div id="orders-section" class="content-section d-none">
        <h4>My Orders</h4>
        <table
          id="myOrdersTable"
          class="table table-striped table-bordered w-100"
        ></table>
      </div>
    </div>
  </div>
</div>
