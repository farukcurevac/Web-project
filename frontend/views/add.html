<section class="add-car-section">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <div class="add-car-card">
          <div class="card">
            <div class="card-body p-4">
              <h2 class="card-title text-center mb-4">Sell Your Car</h2>
              <p class="text-center text-muted mb-4">
                Fill in the details below to list your car for sale
              </p>

              <form class="add-car-form" id="addCarForm">
                <div class="row">
                  <!-- Car Title -->
                  <div class="col-md-12 mb-3">
                    <label for="carTitle" class="form-label">Car Title *</label>
                    <input
                      type="text"
                      class="form-control"
                      id="carTitle"
                      name="title"
                      required
                      placeholder="e.g., BMW 3 Series 2018, Audi A4 2020"
                    />
                  </div>

                  <!-- Category -->
                  <div class="col-md-6 mb-3">
                    <label for="category" class="form-label">Category *</label>
                    <select
                      class="form-select"
                      id="category"
                      name="category_id"
                      required
                    >
                      <option value="">Select Category</option>
                      <option value="1">SUV</option>
                      <option value="2">Sedan</option>
                      <option value="3">Truck</option>
                    </select>
                  </div>

                  <!-- Price -->
                  <div class="col-md-6 mb-3">
                    <label for="price" class="form-label">Price ($) *</label>
                    <input
                      type="number"
                      class="form-control"
                      id="price"
                      name="price"
                      required
                      step="0.01"
                      min="0"
                      placeholder="e.g., 15000"
                    />
                  </div>

                  <!-- Image URL -->
                  <div class="col-md-12 mb-3">
                    <label for="image_url" class="form-label">Image URL</label>
                    <input
                      type="url"
                      class="form-control"
                      id="image_url"
                      name="image_url"
                      placeholder="https://example.com/car-image.jpg"
                    />
                    <div class="form-text">
                      Optional: Provide a direct URL to your car's image
                    </div>
                  </div>

                  <!-- Description -->
                  <div class="col-12 mb-4">
                    <label for="description" class="form-label"
                      >Description</label
                    >
                    <textarea
                      class="form-control"
                      id="description"
                      name="description"
                      rows="4"
                      placeholder="Describe your car's condition, features, and any additional information..."
                    ></textarea>
                  </div>
                </div>

                <!-- Submit Button -->
                <div class="text-center">
                  <button type="submit" class="btn btn-primary btn-lg px-5">
                    <i class="fas fa-plus-circle"></i>
                    Post Car for Sale
                  </button>
                </div>

                <!-- Success/Error Messages -->
                <div id="formMessage" class="mt-3" style="display: none"></div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
